name: BH3 PHP validation

on:
  pull_request:
    paths:
      - 'plugin/**/*.php'
      - '.github/workflows/bh3-php-validation.yml'
  push:
    branches: [main]
    paths:
      - 'plugin/**/*.php'
      - '.github/workflows/bh3-php-validation.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax validation
        run: |
          find plugin -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
