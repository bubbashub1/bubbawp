name: Theme checks and ZIP
on:
  push:
    paths:
      - 'theme/bubba-hub/**'
      - 'scripts/validate-theme.php'
      - 'scripts/security-check-theme.php'
      - '.github/workflows/theme-checks.yml'
  pull_request:
    paths:
      - 'theme/bubba-hub/**'
      - 'scripts/validate-theme.php'
      - 'scripts/security-check-theme.php'
      - '.github/workflows/theme-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find theme/bubba-hub -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/validate-theme.php
          php -l scripts/security-check-theme.php
      - name: Validate theme files and block markup
        run: php scripts/validate-theme.php
      - name: Run theme security guard
        run: php scripts/security-check-theme.php
      - name: Package installable theme
        run: |
          mkdir -p dist
          cd theme
          zip -qr ../dist/bubba-hub-theme.zip bubba-hub -x '*/.DS_Store' '*/Thumbs.db'
          unzip -t ../dist/bubba-hub-theme.zip
          unzip -Z1 ../dist/bubba-hub-theme.zip | grep -Fqx 'bubba-hub/style.css'
          unzip -Z1 ../dist/bubba-hub-theme.zip | grep -Fqx 'bubba-hub/theme.json'
          if unzip -Z1 ../dist/bubba-hub-theme.zip | grep -E '(^|/)([.]env|wp-config[.]php|[.]git)(/|$)'; then
            echo 'Sensitive file in ZIP'
            exit 1
          fi
      - name: Upload theme ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bubba-hub-theme
          path: dist/bubba-hub-theme.zip
          if-no-files-found: error
