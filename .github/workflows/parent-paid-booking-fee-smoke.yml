name: Parent-paid booking fee smoke tests

on:
  pull_request:
    paths:
      - 'plugin/bubba-hub-manager/includes/class-bh-marketplace-settings.php'
      - 'tests/parent-paid-booking-fee-smoke.php'
      - '.github/workflows/parent-paid-booking-fee-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'plugin/bubba-hub-manager/includes/class-bh-marketplace-settings.php'
      - 'tests/parent-paid-booking-fee-smoke.php'
      - '.github/workflows/parent-paid-booking-fee-smoke.yml'

jobs:
  parent-paid-booking-fee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: PHP syntax
        run: |
          php -l plugin/bubba-hub-manager/includes/class-bh-marketplace-settings.php
          php -l tests/parent-paid-booking-fee-smoke.php
      - name: Fee calculation and Stripe contract assertions
        run: php tests/parent-paid-booking-fee-smoke.php
