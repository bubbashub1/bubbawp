name: Support PHP syntax
on:
  pull_request:
    paths:
      - 'plugin/bubba-hub-manager/modules/Support/**'
      - 'plugin/bubba-hub-manager/includes/class-bh-manager.php'
      - '.github/workflows/support-php-lint.yml'
  workflow_dispatch:
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          set -e
          find plugin/bubba-hub-manager/modules/Support -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l plugin/bubba-hub-manager/includes/class-bh-manager.php
